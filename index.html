<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vali Boghean — Oferte</title><style>*{box-sizing:border-box}body{margin:0;background:#111214;color:#f5f2ea;font-family:Arial,sans-serif}header{text-align:center;padding:52px 15px 30px}header small{color:#d4b77d;letter-spacing:4px}h1{font-size:clamp(34px,5vw,65px);margin:16px 0}header p{color:#aaa}main{max-width:1300px;margin:auto;padding:15px 20px 70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.scene{height:560px;perspective:1200px}.card{height:100%;position:relative;transform-style:preserve-3d;transition:transform .75s}.scene.flipped .card{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid #ffffff30;border-radius:15px;overflow:hidden;background:#242527}.front video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.front:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000c);pointer-events:none}.info{position:absolute;z-index:2;bottom:0;width:100%;padding:20px}.info h2{font-size:21px}.info p{color:#ddd}.sound{position:absolute;z-index:3;right:14px;top:14px;background:#111a;color:white;border:1px solid #fff6;border-radius:50%;width:46px;height:46px;cursor:pointer}.sound.active{background:#d4b77d;color:#111}.offer,.backbtn{width:100%;padding:14px;background:#ffffff80;color:white;border:1px solid #ffffff70;border-radius:8px;font-weight:bold;cursor:pointer;backdrop-filter:blur(8px)}.back{transform:rotateY(180deg);padding:26px;display:flex;flex-direction:column;overflow-y:auto}.back small,.section{color:#d4b77d;letter-spacing:2px}.back h2{font-size:22px}.section{font-size:12px;margin:18px 0 8px;text-transform:uppercase}.details{list-style:none;padding:0;margin:0}.details li{font-size:17px;line-height:1.45;padding:8px 0;border-bottom:1px solid #ffffff20}.backbtn{margin-top:auto;flex-shrink:0}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#524636,#242426 70%);color:#ddd;padding:20px;text-align:center}@media(max-width:850px){main{grid-template-columns:1fr;max-width:520px}.scene{height:550px}}</style><header><small>LIVE MUSIC EXPERIENCE</small><h1>VALI BOGHEAN</h1><p>Alege formula potrivită evenimentului tău</p></header><main id="grid"></main><script>const offers=[{name:"BOGHEAN BALKANIC BAND",count:"12 muzicieni",team:"12 muzicieni în scenă + Sunetist + 2 șoferi",transport:"2 unități de transport - 0.6 euro/km",rooms:"1 single + 8 double room (cu mic dejun inclus)",diem:"40 Euro/persoană (15 persoane)",file:"videos/boghean-balkanic.mp4"},{name:"BOGHEAN BAND CLASIC",count:"7 muzicieni",team:"7 muzicieni în scenă + Sunetist + șoferi",transport:"1 unitate transport - 0.6 euro/km",rooms:"1 single + 4 double room (cu mic dejun inclus)",diem:"40 Euro/persoană (9 persoane)",file:"videos/boghean-band-clasic.m4v"},{name:"VALI BOGHEAN ACOUSTIC",count:"4 muzicieni",team:"4 muzicieni în scenă + Sunetist + șofer",transport:"1 unitate transport - 0.6 euro/km",rooms:"1 single + 3 double room (cu mic dejun inclus)",diem:"40 Euro/persoană (6 persoane)",file:"videos/vali-boghean-acoustic.m4v"}];const grid=document.getElementById("grid"),videos=[],scenes=[];let active=-1;function sound(i){active=active===i?-1:i;videos.forEach((v,j)=>{v.muted=j!==active;v.play().catch(()=>{})});scenes.forEach((s,j)=>{let b=s.querySelector(".sound");b.textContent=j===active?"♫":"♪";b.classList.toggle("active",j===active)})}offers.forEach((o,i)=>{let s=document.createElement("section");s.className="scene";s.innerHTML='<div class="card"><div class="face front"><div class="placeholder">Videoclip în curs de încărcare</div><video autoplay muted loop playsinline preload="auto"></video><button class="sound" aria-label="Activează sunetul">♪</button><div class="info"><h2>'+o.name+'</h2><p>'+o.count+'</p><button class="offer">VEZI OFERTA ↻</button></div></div><div class="face back"><small>OFERTĂ MUZICALĂ</small><h2>'+o.name+'</h2><div class="section">Formula și logistica</div><ul class="details"><li>'+o.team+'</li><li>'+o.transport+'</li><li>Backline inclus</li></ul><div class="section">Este necesar</div><ul class="details"><li>'+o.rooms+'</li><li>Diurnă - '+o.diem+'</li></ul><button class="backbtn">↶ ÎNAPOI LA VIDEO</button></div></div>';grid.append(s);scenes.push(s);let v=s.querySelector("video");videos.push(v);v.src=o.file;v.addEventListener("loadeddata",()=>s.querySelector(".placeholder").style.display="none");v.play().catch(()=>{});s.querySelector(".offer").onclick=()=>s.classList.add("flipped");s.querySelector(".backbtn").onclick=()=>s.classList.remove("flipped");s.querySelector(".sound").onclick=()=>sound(i);v.onclick=()=>sound(i)});</script></html>
